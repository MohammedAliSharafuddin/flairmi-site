<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">FlairMI</title>
  <desc id="desc">Open textbooks, free Excel templates, and analytics tools for teaching, research, and practice.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2138" />
      <stop offset="100%" stop-color="#1f4d8f" />
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- text column: x 72-720, kept clear of the decorative zone (x 780-1130) -->
  <text x="72" y="112" fill="#d88a1d" font-family="DejaVu Sans Mono, monospace" font-size="22" letter-spacing="4" font-weight="bold">FLAIRMI</text>

  <text x="72" y="222" fill="#ffffff" font-family="DejaVu Serif, serif" font-size="66" font-weight="bold">Textbooks, templates,</text>
  <text x="72" y="294" fill="#ffffff" font-family="DejaVu Serif, serif" font-size="66" font-weight="bold">and analytics tools.</text>

  <text x="72" y="352" fill="#c3d3e8" font-family="DejaVu Sans, sans-serif" font-size="27">Open textbooks, free Excel templates, and R packages</text>
  <text x="72" y="388" fill="#c3d3e8" font-family="DejaVu Sans, sans-serif" font-size="27">for teaching, research, and practice.</text>

  <rect x="72" y="458" width="300" height="56" rx="10" fill="#d88a1d" />
  <text x="102" y="494" fill="#0f2138" font-family="DejaVu Sans Mono, monospace" font-size="22" font-weight="bold" letter-spacing="1">FLAIRMI.COM</text>

  <text x="72" y="562" fill="#8fa6c2" font-family="DejaVu Sans, sans-serif" font-size="22">By Mohammed Ali Sharafuddin</text>

  <!-- decorative zone: fully separate from the text column, x 780-1130 -->
  <circle cx="960" cy="180" r="86" fill="#ffffff" fill-opacity="0.08" />
  <circle cx="1050" cy="270" r="46" fill="#d88a1d" fill-opacity="0.85" />
  <circle cx="880" cy="290" r="34" fill="#ffffff" fill-opacity="0.16" />

  <rect x="792" y="368" width="326" height="176" rx="16" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.18" />
  <text x="824" y="416" fill="#ffffff" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="bold">Textbooks</text>
  <text x="824" y="454" fill="#ffffff" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="bold">Templates</text>
  <text x="824" y="492" fill="#ffffff" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="bold">surveyframe</text>
  <text x="824" y="524" fill="#c3d3e8" font-family="DejaVu Sans, sans-serif" font-size="19">R package, live on CRAN</text>
</svg>
